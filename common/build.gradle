architectury {
	common(rootProject.enabled_platforms.split(","))
}

loom {
	accessWidenerPath = file("src/main/resources/agricraft.accesswidener")
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"

	modCompileOnly "mezz.jei:jei-$minecraft_version-common-api:$jei_version"
//	modRuntimeOnly "mezz.jei:jei-$minecraft_version-common:$jei_version"
//	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api:$rei_version"
//	modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin:$rei_version"
	modCompileOnly "dev.emi:emi-xplat-intermediary:$emi_version:api"

//	modCompileOnly "curse.maven:jade-324717:4980187"  // Jade-1.20.4-fabric-13.2.1-api
	modCompileOnly "curse.maven:jade-324717:$jade_fabric_version"
	modCompileOnly "mcp.mobius.waila:wthit-api:fabric-$wthit_version"

	modCompileOnly("vazkii.botania:Botania:$botania_version-FORGE:api") { transitive = false }
}

tasks.register('irrigationFlowTest', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.agricraft.agricraft.common.block.entity.IrrigationFlowTest'
	jvmArgs '-ea'
}

tasks.register('irrigationTankTest', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.agricraft.agricraft.common.block.IrrigationTankBlockTest'
	jvmArgs '-ea'
}

tasks.register('createHarvestTest', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.agricraft.agricraft.compat.create.CreateHarvestCompatTest'
	jvmArgs '-ea'
}

tasks.register('irrigationBucketsTest', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.agricraft.agricraft.common.block.entity.IrrigationBucketsTest'
	jvmArgs '-ea'
}

tasks.named('check') {
	dependsOn tasks.named('irrigationFlowTest')
	dependsOn tasks.named('irrigationTankTest')
	dependsOn tasks.named('createHarvestTest')
	dependsOn tasks.named('irrigationBucketsTest')
}
